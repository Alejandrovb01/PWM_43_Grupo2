<ion-card class="dish-description">
  <img [src]="'assets/' + dish.image" [alt]="dish.name" class="dish-image">
  <ion-card-content>
    <ion-text color="dark">
      <h1 class="dish-title">{{ dish.name }}</h1>
      <p>{{ dish.description }}</p>
    </ion-text>
  </ion-card-content>
</ion-card>

<ion-card class="dish-options">
  <ion-card-header>
    <ion-card-title class="options-title">Alérgenos</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <div class="options-list">
      <img
        *ngFor="let alergeno of dish.alergenos"
        [src]="'assets/alergenos/' + alergeno.name + '.png'"
        [alt]="alergeno.name"
        class="options-element"
      />
    </div>
  </ion-card-content>
</ion-card>

<div class="button-container ion-text-center">
  <ng-container *ngIf="showAddButton; else showPriceOnly">
    <ion-button class="buy-button" expand="block" color="primary" (click)="addToCart(dish); $event.stopPropagation()">
      Añadir - {{ dish.price }}€
    </ion-button>
  </ng-container>
  <ng-template #showPriceOnly>
    <ion-text color="medium" class="price">
      <p class="price">{{ dish.price }}€</p>
    </ion-text>
  </ng-template>
</div>

<div class="heart-container">
  <ion-button expand="block" color="medium" (click)="toggleFavorite()">
  <ng-container *ngIf="!isFavoriteDish; else filledHeart">
    <!-- Vacío -->
    <svg height="30px" width="30px" viewBox="0 0 24.00 24.00" xmlns="http://www.w3.org/2000/svg" fill="#00BB57" stroke="#00BB57" stroke-width="0.00024">
      <path d="M12 22.59l-9.2-9.12C.43 11.09.43 7.21 2.8 4.83a6.03 6.03 0 0 1 4.29-1.79c1.62 0 3.14.63 4.29 1.79l.62.62.62-.62a6.014 6.014 0 0 1 4.29-1.79c1.62 0 3.14.63 4.29 1.79 2.37 2.38 2.37 6.26 0 8.64L12 22.59zM7.09 4c-1.37 0-2.65.54-3.61 1.51-2 2.01-2 5.28 0 7.29L12 21.25l8.53-8.45c2-2.01 2-5.28 0-7.29A5.079 5.079 0 0 0 16.92 4c-1.37 0-2.65.54-3.61 1.51l-1.3 1.3-1.3-1.3C9.75 4.54 8.46 4.01 7.1 4z"></path>
      <path fill="none" d="M0 0h24v24H0z"></path>
    </svg>
  </ng-container>
  <ng-template #filledHeart>
    <!-- Lleno -->
    <svg height="30px" width="30px" viewBox="0 0 24.00 24.00" xmlns="http://www.w3.org/2000/svg" fill="#00BB57">
      <path d="M12 22.59l-9.2-9.12C.43 11.09.43 7.21 2.8 4.83a6.03 6.03 0 0 1 4.29-1.79c1.62 0 3.14.63 4.29 1.79l.62.62.62-.62a6.014 6.014 0 0 1 4.29-1.79c1.62 0 3.14.63 4.29 1.79 2.37 2.38 2.37 6.26 0 8.64L12 22.59z"></path>
      <path fill="none" d="M0 0h24v24H0z"></path>
    </svg>
  </ng-template>
</ion-button>
</div>
