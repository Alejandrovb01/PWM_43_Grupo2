<div class="dish-detail-container">
  <div *ngIf="loading" class="loading-spinner">Cargando...</div>

  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="dish && !loading" class="dish-content">
    <div class="dish-header">
      <h1>{{ dish.nombre }}</h1>
      <span class="price">{{ dish.precio }}</span>
    </div>

    <div class="dish-body">
      <img class="dish-image" [src]="dish.imagePath" [alt]="dish.nombre">

      <div class="dish-info">
        <p class="description">{{ dish.descripcion }}</p>

        <div *ngIf="allergens.length" class="allergens-section">
          <h3>Alérgenos:</h3>
          <div class="allergens-list">
            <div *ngFor="let allergen of allergens" class="allergen-tag">
              <img [src]="allergen.image" [alt]="allergen.name">
              <span>{{ allergen.name }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
