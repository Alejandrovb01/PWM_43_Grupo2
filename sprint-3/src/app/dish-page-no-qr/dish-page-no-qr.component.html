<div class="dish-page">
  <div *ngIf="loading" class="loading">Cargando...</div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && !error">
    <section class="dish-description">
      <img [src]="dishImage" [alt]="dishTitle" class="dish-image">
      <div class="dish-text">
        <h1 class="dish-title">{{ dishTitle }}</h1>
        <p class="dish-price">{{ dishPrice }}</p>
        <p class="dish-description">{{ dishDescription }}</p>
      </div>
    </section>

    <section class="dish-options" *ngIf="allergens.length > 0">
      <h2 class="options-title">Alérgenos</h2>
      <div class="options-list">
        <img *ngFor="let allergen of allergens"
             [src]="allergen.image"
             [alt]="allergen.name"
             [title]="allergen.name">
      </div>
    </section>
  </div>
</div>
