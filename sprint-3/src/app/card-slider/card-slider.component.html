<div class="card-slider" (click)="navigateToDetail()">
  <img [src]="'assets/' + image" [alt]="title" class="card-image">
  <h3 class="card-title">{{ title }}</h3>
  <div class="description">
    <p class="card-description">{{ description }}</p>
  </div>
  <div class="card-actions">
    <button class="button" (click)="addToCart($event)">Añadir - {{ price }}€</button>
  </div>
</div>
