<div class="card-slider">
  <img [src]="'assets/' + image" [alt]="title" class="card-image">
  <h3 class="card-title">{{ title }}</h3>
  <div class="description">
    <p class="card-description">{{ description }}</p>
  </div>
  <button class="button">Add - <span class="card-price">{{ price }}</span></button>
</div>
